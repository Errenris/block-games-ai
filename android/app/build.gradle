plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blockgames.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.blockgames.ai"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.0.6"
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'blockgames123'
            keyAlias 'blockgames'
            keyPassword 'blockgames123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Pure native WebView - zero external dependency conflicts
}
