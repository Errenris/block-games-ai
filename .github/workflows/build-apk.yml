name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Permanent Keystore
        working-directory: ./android/app
        run: |
          if [ ! -f "release.keystore" ]; then
            echo "Creating permanent release keystore for future updates..."
            keytool -genkeypair -v -keystore release.keystore -alias blockgames -keyalg RSA -keysize 2048 -validity 10000 -storepass blockgames123 -keypass blockgames123 -dname "CN=BlockGames, OU=Games, O=BlockGames, L=Jakarta, ST=Jakarta, C=ID"
          fi

      - name: Build APK with Gradle 8.6
        working-directory: ./android
        run: |
          echo "Setting up Gradle wrapper..."
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          echo "Building signed debug and release APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/*.apk release-apk/BlockGames-AI.apk
          echo "APK successfully signed and prepared!"

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockGames-AI-APK
          path: release-apk/BlockGames-AI.apk
          retention-days: 30

      - name: Publish GitHub Release (Push to main / master)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Block Games AI v1.0.${{ github.run_number }}
          files: release-apk/BlockGames-AI.apk
          body: |
            ### 🎮 Block Games AI - Android APK (Signed Keystore)
            
            Build otomatis berhasil selesai dari commit `${{ github.sha }}`!
            
            **Pembaruan v1.0.${{ github.run_number }}:**
            - 🔑 **Signed Keystore Permanen:** Update aplikasi ke depan tidak akan bentrok (*signature conflict*).
            - ⚙️ **Tombol Pengaturan Minimalis:** Hanya ikon gear `⚙️` tanpa tulisan panjang yang menutupi layar.
            - 🕹️ **LCD Otentik:** Tulisan `AI` di layar LCD dihilangkan, tampilan konsol 100% murni seperti konsol retro asli.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
